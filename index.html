// Dibuja un ícono de la app (paths de ICON, pensados para stroke a 24x24) dentro de un canvas.
// Los íconos de ICON son SVG pensados para <svg><path>/<rect>/<circle></svg> a 24x24;
// acá se re-dibujan a mano sobre canvas (Path2D no lee rect/circle, solo paths).
function dibujarIconoEnCanvas(ctx, nombreIcono, x, y, size, color, strokeW){
  const svgStr = ICON[nombreIcono];
  if(!svgStr) return;
  const s = size/24;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.strokeStyle = color;
  ctx.lineWidth = strokeW / s;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const tagRe = /<(path|rect|circle)\s+([^>]*)\/>/g;
  let m;
  while((m = tagRe.exec(svgStr))){
    const tag = m[1];
    const attrs = {};
    m[2].replace(/([a-zA-Z-]+)="([^"]*)"/g, (_, k, v) => { attrs[k] = v; return ""; });
    if(tag === "path" && attrs.d){
      ctx.stroke(new Path2D(attrs.d));
    } else if(tag === "rect"){
      const rx = parseFloat(attrs.x)||0, ry = parseFloat(attrs.y)||0, rw = parseFloat(attrs.width)||0, rh = parseFloat(attrs.height)||0, rr = parseFloat(attrs.rx)||0;
      if(rr>0) dibujarRectRedondeado(ctx, rx, ry, rw, rh, rr);
      else{ ctx.beginPath(); ctx.rect(rx, ry, rw, rh); }
      ctx.stroke();
    } else if(tag === "circle"){
      const cx = parseFloat(attrs.cx)||0, cy = parseFloat(attrs.cy)||0, r = parseFloat(attrs.r)||0;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      if(attrs.fill === "currentColor"){ ctx.fillStyle = color; ctx.fill(); }
      else{ ctx.stroke(); }
    }
  }
  ctx.restore();
}

function dibujarImagenEnCirculo(ctx, img, cx, cy, r){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  const s = Math.max((r*2)/img.width, (r*2)/img.height);
  const w = img.width*s, h = img.height*s;
  ctx.drawImage(img, cx - w/2, cy - h/2, w, h);
  ctx.restore();
}

// Reduce el tamaño de fuente hasta que el texto quepa en maxWidth (sin pasar de tamMinimo).
function ajustarFuenteParaAncho(ctx, texto, maxWidth, peso, tamInicial, tamMinimo){
  let tam = tamInicial;
  while(tam > tamMinimo){
    ctx.font = `${peso} ${tam}px Arial, sans-serif`;
    if(ctx.measureText(texto).width <= maxWidth) break;
    tam -= 1;
  }
  ctx.font = `${peso} ${tam}px Arial, sans-serif`;
  return tam;
}

// Corta el texto con "…" si sigue sin caber (con la fuente ya asignada en ctx).
function truncarTexto(ctx, texto, maxWidth){
  if(ctx.measureText(texto).width <= maxWidth) return texto;
  let t = texto;
  while(t.length > 1 && ctx.measureText(t+"…").width > maxWidth) t = t.slice(0,-1);
  return t + "…";
}

function dibujarChip(ctx, x, y, icono, texto){
  ctx.font = "600 15px Arial, sans-serif";
  const iconSize = 15, padX = 14, gap = 7, h = 34;
  const w = padX*2 + iconSize + gap + ctx.measureText(texto).width;
  dibujarRectRedondeado(ctx, x, y, w, h, h/2);
  ctx.fillStyle = "rgba(255,255,255,0.14)";
  ctx.fill();
  dibujarIconoEnCanvas(ctx, icono, x+padX, y+h/2-iconSize/2, iconSize, "#FFFFFF", 2);
  ctx.fillStyle = "#FFFFFF";
  ctx.textBaseline = "middle";
  ctx.fillText(texto, x+padX+iconSize+gap, y+h/2+1);
  ctx.textBaseline = "alphabetic";
  return w;
}

function dibujarRectRedondeado(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

async function dibujarTarjetaPresentacion(canvas){
  const p = state.perfil || {};
  const W = 1000, H = 580, ESCALA = 2;
  canvas.width = W*ESCALA;
  canvas.height = H*ESCALA;
  const ctx = canvas.getContext("2d");
  ctx.scale(ESCALA, ESCALA);

  const [foto, logo] = await Promise.all([cargarImagenTarjeta(p.foto), cargarImagenTarjeta(p.negocioLogo)]);
  if(!document.body.contains(canvas)) return; // el usuario navegó a otra pantalla mientras cargaban las imágenes

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,"#0B2A45");
  grad.addColorStop(1,"#0E63B0");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath(); ctx.arc(W-60, -40, 220, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-140, H+40, 170, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.10;
  dibujarIconoEnCanvas(ctx, "snowflake", W-200, H-260, 140, "#FFFFFF", 1.3);
  ctx.restore();

  const padX = 56;

  if(logo){
    const logoSize = 92, lx = W - padX - logoSize, ly = 40;
    ctx.save();
    dibujarRectRedondeado(ctx, lx, ly, logoSize, logoSize, 18);
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fill();
    ctx.clip();
    const s = Math.max(logoSize/logo.width, logoSize/logo.height);
    const w = logo.width*s, h = logo.height*s;
    ctx.drawImage(logo, lx + logoSize/2 - w/2, ly + logoSize/2 - h/2, w, h);
    ctx.restore();
  }

  const avatarR = 62, avatarCx = padX + avatarR, avatarCy = 96;
  ctx.save();
  ctx.beginPath();
  ctx.arc(avatarCx, avatarCy, avatarR+4, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fill();
  ctx.restore();
  if(foto){
    dibujarImagenEnCirculo(ctx, foto, avatarCx, avatarCy, avatarR);
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.arc(avatarCx, avatarCy, avatarR, 0, Math.PI*2);
    ctx.fillStyle = "#0E63B0";
    ctx.fill();
    ctx.restore();
    dibujarIconoEnCanvas(ctx, "user", avatarCx-26, avatarCy-26, 52, "#FFFFFF", 2);
  }

  const textX = padX + avatarR*2 + 28;
  const maxWidthTop = (logo ? (W - padX - 92 - 20) : (W - padX)) - textX;

  const nombreTxt = p.nombre || "Técnico";
  ctx.fillStyle = "#FFFFFF";
  ajustarFuenteParaAncho(ctx, nombreTxt, maxWidthTop, "700", 34, 20);
  ctx.fillText(truncarTexto(ctx, nombreTxt, maxWidthTop), textX, avatarCy - 6);

  const negocioTxt = p.negocioNombre || "AiresCare";
  ctx.fillStyle = "#8FD9C4";
  ajustarFuenteParaAncho(ctx, negocioTxt, maxWidthTop, "600", 21, 14);
  ctx.fillText(truncarTexto(ctx, negocioTxt, maxWidthTop), textX, avatarCy + 26);

  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.font = "400 16px Arial, sans-serif";
  ctx.fillText(truncarTexto(ctx, "Mantenimiento de Aires Acondicionados", maxWidthTop), textX, avatarCy + 50);

  const lineY = 210;
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(padX, lineY);
  ctx.lineTo(W-padX, lineY);
  ctx.stroke();

  const filas = [];
  if(p.telefono) filas.push({icon:"phone", texto: p.telefono});
  if(p.correo) filas.push({icon:"mail", texto: p.correo});

  let rowY = lineY + 56;
  const iconBox = 34;
  ctx.textBaseline = "middle";
  filas.forEach(fila=>{
    ctx.save();
    ctx.beginPath();
    ctx.arc(padX+iconBox/2, rowY, iconBox/2, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fill();
    ctx.restore();
    dibujarIconoEnCanvas(ctx, fila.icon, padX+iconBox/2-9, rowY-9, 18, "#FFFFFF", 2);
    ctx.fillStyle = "#FFFFFF";
    const rowTextX = padX+iconBox+16;
    const maxWidthRow = (W-padX) - rowTextX;
    ajustarFuenteParaAncho(ctx, fila.texto, maxWidthRow, "500", 20, 14);
    ctx.fillText(truncarTexto(ctx, fila.texto, maxWidthRow), rowTextX, rowY+1);
    rowY += 48;
  });
  ctx.textBaseline = "alphabetic";

  const servicios = [{icon:"wrench", texto:"Mantenimiento"}, {icon:"ac", texto:"Instalación"}, {icon:"check", texto:"Garantía"}];
  let chipX = padX;
  const chipY = rowY + (filas.length ? 14 : 0);
  servicios.forEach(s=>{
    chipX += dibujarChip(ctx, chipX, chipY, s.icon, s.texto) + 10;
  });

  const footerH = 64;
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(0, H-footerH, W, footerH);
  dibujarIconoEnCanvas(ctx, "whatsapp", padX, H-footerH/2-11, 22, "#8FD9C4", 2);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "600 18px Arial, sans-serif";
  ctx.textBaseline = "middle";
  ctx.fillText("Contáctame por WhatsApp", padX+34, H-footerH/2+1);
  ctx.textBaseline = "alphabetic";
}

function actualizarTarjetaCanvas(){
  const canvas = document.getElementById("tarjeta-canvas");
  if(!canvas) return;
  dibujarTarjetaPresentacion(canvas).catch(()=>{});
}

function nombreArchivoTarjeta(){
  const base = (state.perfil.negocioNombre || state.perfil.nombre || "AiresCare")
    .replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase().replace(/^-+|-+$/g,"");
  return `tarjeta-${base || "airescare"}.png`;
}

function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function obtenerBlobTarjeta(){
  return new Promise((resolve)=>{
    const canvas = document.getElementById("tarjeta-canvas");
    if(!canvas){ resolve(null); return; }
    canvas.toBlob(blob=>resolve(blob), "image/png");
  });
}

async function compartirTarjetaWhatsApp(){
  const blob = await obtenerBlobTarjeta();
  if(!blob){ showToast("No se pudo generar la tarjeta"); return; }
  const archivo = new File([blob], nombreArchivoTarjeta(), { type: "image/png" });
  if(navigator.canShare && navigator.canShare({ files: [archivo] })){
    try{
      await navigator.share({ files: [archivo], title: "Tarjeta de presentación" });
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;
    }
  }
  descargarBlob(blob, nombreArchivoTarjeta());
  const negocioNombre = state.perfil.negocioNombre || "AiresCare";
  const mensaje = `Hola, te comparto mis datos de contacto para el mantenimiento de tu aire acondicionado. — ${negocioNombre}`;
  window.open(linkWhatsApp("", mensaje), "_blank", "noopener");
  showToast("Imagen descargada. Elige el chat en WhatsApp y adjunta la imagen descargada.");
}

async function descargarTarjetaImagen(){
  const blob = await obtenerBlobTarjeta();
  if(!blob){ showToast("No se pudo generar la tarjeta"); return; }
  descargarBlob(blob, nombreArchivoTarjeta());
  showToast("Imagen descargada");
}

/* ---------- Notificaciones de mantenimiento ---------- */
function notificacionesSoportadas(){
  return "Notification" in window;
}

function pedirPermisoNotificaciones(){
  if(!notificacionesSoportadas()){
    showToast("Tu navegador no soporta notificaciones");
    return;
  }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      showToast("Notificaciones activadas");
      revisarMantenimientosProximos(true);
      registrarTokenFCM();
    } else if(perm==="denied"){
      showToast("Notificaciones bloqueadas por el navegador");
    }
    render();
  });
}

async function registrarTokenFCM(mostrarAviso){
  if(!messaging){
    if(mostrarAviso) showToast("Este navegador no soporta notificaciones push");
    return;
  }
  if(!state.usuario || Notification.permission !== "granted") return;
  try{
    const registration = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if(token){
      await docUsuario().collection("tokens").doc(token).set({
        token,
        creado: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent: navigator.userAgent
      });
      if(mostrarAviso) showToast("Dispositivo registrado para notificaciones push ✓");
    } else if(mostrarAviso){
      showToast("No se obtuvo un token de notificaciones");
    }
  }catch(e){
    console.error("No se pudo registrar el token de notificaciones push:", e);
    if(mostrarAviso) showToast("Error: " + (e.message || e.code || "no se pudo registrar"));
  }
}

function enviarNotificacion(title, body, tagKey){
  const opts = {
    body,
    icon: "icon-192.png",
    badge: "icon-192.png",
    tag: tagKey,
    renotify: false
  };
  if(swRegistration && swRegistration.showNotification){
    swRegistration.showNotification(title, opts).catch(()=>{
      try{ new Notification(title, opts); }catch(e){}
    });
  } else {
    try{ new Notification(title, opts); }catch(e){}
  }
}

// Revisa todos los equipos y notifica los que tengan mantenimiento vencido, hoy o mañana.
// forzar=true ignora el registro de "ya notificado" (util justo despues de activar permisos).
// NOTA: el aviso local automático quedó desactivado a propósito. Ahora todos
// los avisos de mantenimiento los manda el robot de GitHub Actions (mismo
// aviso, pero sin duplicarlo). Esta función se deja definida por si se
// necesita reactivar, pero ya no se llama sola.
function revisarMantenimientosProximos(forzar){
  if(!notificacionesSoportadas() || Notification.permission !== "granted") return;
  const log = forzar ? [] : loadNotifLog();
  let changed = false;

  state.equipos.forEach(eq=>{
    if(!eq.proximo) return;
    const dias = diasRestantes(eq.proximo);
    if(dias > 1) return; // solo avisar si es hoy, manana, o ya se vencio

    const key = `${eq.id}_${eq.proximo}`;
    if(log.includes(key)) return;

    let mensaje;
    if(dias === 0) mensaje = `El mantenimiento de "${eq.nombre}" es hoy.`;
    else if(dias === 1) mensaje = `El mantenimiento de "${eq.nombre}" es mañana.`;
    else mensaje = `El mantenimiento de "${eq.nombre}" venció hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}.`;

    // enviarNotificacion("AiresCare · Recordatorio", mensaje, key); // desactivado: lo manda el robot
    log.push(key);
    changed = true;
  });

  if(changed) saveNotifLog(log);
}
