<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AiresCare - Mantenimiento de Aires Acondicionados</title>
<meta name="description" content="Recordatorios y control de mantenimiento para tus aires acondicionados." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0E63B0" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AiresCare" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF2F8;
    --app-bg:#F3F8FC;
    --card:#FFFFFF;
    --ink:#0B2A45;
    --ink-soft:#5B7A93;
    --primary:#0E63B0;
    --primary-deep:#083A66;
    --accent:#37B6C4;
    --mint:#28A88B;
    --line:#DCEAF3;
    --chip-bg:#E7F3FC;
    --warn:#E8A33D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--app-bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  button, select, textarea, input{ font-family:inherit; }
  button{ cursor:pointer; }
  .screen{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .statusbar{
    display:flex; justify-content:space-between; padding:10px 20px 2px;
    font-size:13px; font-weight:600; color:var(--ink);
    padding-top: calc(env(safe-area-inset-top, 10px) + 6px);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 16px 14px;
  }
  .topbar .title{ font-weight:700; font-size:17px; color:var(--ink); }
  .iconbtn{ background:none; border:none; padding:6px; margin:-6px; display:flex; }
  .scroll{ flex:1; overflow-y:auto; padding:0 20px 16px; -webkit-overflow-scrolling:touch; }
  .bottomnav{
    display:flex; justify-content:space-around; align-items:center;
    padding:10px 8px calc(env(safe-area-inset-bottom,14px) + 10px);
    border-top:1px solid var(--line); background:var(--card);
  }
  .navbtn{ background:none; border:none; display:flex; flex-direction:column; gap:2px; align-items:center; color:var(--ink-soft); font-size:10px; font-weight:600; }
  .navbtn.active, .navbtn.active svg{ color:var(--primary); }
  .navbtn-add{ background:var(--primary); border-radius:999px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(14,99,176,0.35); border:none; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .btn-primary{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:13px 0; font-weight:700; font-size:14px;
  }
  .btn-outline{
    width:100%; background:var(--card); color:var(--primary); border:1.5px solid var(--primary);
    border-radius:12px; padding:13px 0; font-weight:700; font-size:14px;
  }
  .field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-top:14px; }
  .field-input{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:13.5px; color:var(--ink); background:var(--card); margin-top:6px;
  }
  .chip{
    display:inline-block; background:var(--chip-bg); color:var(--primary);
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .equipo-icon{
    width:44px; height:44px; border-radius:12px; background:var(--chip-bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  a.equipo-row{ text-decoration:none; color:inherit; }
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--primary-deep); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none;
    z-index:50; max-width:90%;
  }
  .toast.show{ opacity:1; }
  ::-webkit-scrollbar{ width:0; }

  .install-banner{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--primary-deep); color:#fff; padding:12px 16px; display:none;
    align-items:center; justify-content:space-between; gap:10px; z-index:60;
    font-size:13px;
  }
  .install-banner button{
    background:#fff; color:var(--primary-deep); border:none; border-radius:8px;
    padding:8px 14px; font-weight:700; font-size:13px; flex-shrink:0;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="install-banner" id="installBanner">
  <span>Instala AiresCare en tu pantalla de inicio</span>
  <button id="installBtn">Instalar</button>
</div>

<script>
/* ---------- Iconos SVG mínimos (sin dependencias externas) ---------- */
const ICON = {
  home: `<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>`,
  wind: `<path d="M4 8h11a3 3 0 1 0-3-3"/><path d="M2 13h15a3 3 0 1 1-3 3"/><path d="M4 18h9a2.5 2.5 0 1 0-2.5-2.5"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>`,
  bell: `<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/>`,
  chevronLeft: `<path d="M15 18l-6-6 6-6"/>`,
  chevronRight: `<path d="M9 18l6-6-6-6"/>`,
  snowflake: `<path d="M12 2v20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/><path d="M12 2l-2 2M12 2l2 2M12 22l-2-2M12 22l2-2M4.9 4.9l2.8.7M4.9 4.9l.7-2.8M19.1 4.9l-2.8.7M19.1 4.9l-.7-2.8M4.9 19.1l2.8-.7M4.9 19.1l.7 2.8M19.1 19.1l-2.8-.7M19.1 19.1l-.7 2.8"/>`,
  calendar: `<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>`,
  check: `<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>`,
  filter: `<path d="M4 5h16l-6 8v5l-4 2v-7z"/>`,
  edit: `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>`,
  thermo: `<path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/>`,
  leaf: `<path d="M11 20A7 7 0 0 1 4 13c0-6 6-11 16-11-1 9-6 16-11 18z"/><path d="M4 20 15 9"/>`,
  wrench: `<path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 1 5.4-5.4L21 6l-3-3z"/>`,
  user: `<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`
};
function svg(name, size=20, color="currentColor", strokeW=2){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||""}</svg>`;
}

/* ---------- Datos ---------- */
// La app arranca sin equipos registrados: el usuario los agrega desde cero.
const DEFAULT_EQUIPOS = [];

const CONSEJOS = [
  {icon:"filter", text:"Limpia los filtros cada 2 semanas para un mejor rendimiento."},
  {icon:"thermo", text:"Mantén la temperatura entre 24°C y 26°C para ahorrar energía."},
  {icon:"wrench", text:"Realiza mantenimiento preventivo cada 6 meses."},
  {icon:"leaf", text:"Un equipo limpio consume menos energía y cuida el ambiente."}
];

/* ---------- Estado / almacenamiento ---------- */
const STORAGE_KEY = "airescare_equipos_v2";
function loadEquipos(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_EQUIPOS));
}
function saveEquipos(equipos){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(equipos)); }catch(e){}
}

let state = {
  screen: "home",
  equipos: loadEquipos(),
  equipoSelId: null,
  lastSaved: null
};

function fechaISOaDMY(iso){
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function parseDMY(str){
  const [d,m,y] = str.split("/").map(Number);
  return new Date(y, m-1, d);
}
function diasRestantes(fechaStr){
  if(!fechaStr) return null;
  const target = parseDMY(fechaStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((target - today) / 86400000);
  return diff;
}
function fechaLarga(str){
  if(!str) return "Sin programar";
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const d = parseDMY(str);
  return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function nextId(){
  return state.equipos.reduce((max,e)=>Math.max(max,e.id),0) + 1;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- Navegación ---------- */
function go(screen){
  state.screen = screen;
  render();
  document.querySelector(".scroll") && (document.querySelector(".scroll").scrollTop = 0);
}
function openEquipo(id){
  state.equipoSelId = id;
  go("detalle");
}

/* ---------- Render de layout compartido ---------- */
function statusBar(){
  return `<div class="statusbar"><span>9:41</span><span>•••• Wi‑Fi 🔋</span></div>`;
}
function topBar(title, showBack, rightHtml){
  return `
    <div class="topbar">
      <div style="width:32px;">${showBack ? `<button class="iconbtn" onclick="go('${showBack}')">${svg('chevronLeft',22,'#0B2A45')}</button>` : ""}</div>
      <div class="title">${title}</div>
      <div style="width:32px; display:flex; justify-content:flex-end;">${rightHtml||""}</div>
    </div>`;
}
function bottomNav(active){
  const items = [
    {key:"home", icon:"home", label:"Inicio"},
    {key:"equipos", icon:"wind", label:"Equipos"},
    {key:"add", icon:"plus", label:""},
    {key:"historial", icon:"clock", label:"Historial"},
    {key:"perfil", icon:"user", label:"Perfil"}
  ];
  return `<div class="bottomnav">${items.map(it=>{
    if(it.key==="add"){
      return `<button class="navbtn-add" onclick="go('agregarEquipo')">${svg('plus',22,'#fff')}</button>`;
    }
    const isActive = active===it.key;
    const target = it.key==="perfil" ? "home" : it.key;
    return `<button class="navbtn ${isActive?'active':''}" onclick="go('${target}')">
      ${svg(it.icon,20, isActive?'#0E63B0':'#5B7A93')}
      <span>${it.label}</span>
    </button>`;
  }).join("")}</div>`;
}

/* ---------- Pantallas ---------- */
function screenHome(){
  const eqs = state.equipos;

  if(eqs.length === 0){
    return `
      <div class="screen">
        ${statusBar()}
        <div style="padding:8px 20px 0; display:flex; justify-content:flex-end;">
          <button class="iconbtn">${svg('bell',22,'#0B2A45')}</button>
        </div>
        <div class="scroll" style="display:flex; flex-direction:column;">
          <div style="font-size:22px; font-weight:800;">¡Hola!</div>
          <div style="font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4;">
            Registra tu primer aire acondicionado para empezar a recibir recordatorios de mantenimiento.
          </div>
          <div style="margin-top:22px; background:linear-gradient(135deg, var(--primary-deep), var(--primary)); border-radius:24px; height:140px; position:relative; display:flex; align-items:center; justify-content:center;">
            ${svg('wind',64,'rgba(255,255,255,0.9)',1.5)}
            <div style="position:absolute; top:16px; right:20px;">${svg('snowflake',22,'#BFE7F2')}</div>
            <div style="position:absolute; bottom:14px; left:24px;">${svg('snowflake',14,'#BFE7F2')}</div>
          </div>
          <div class="card" style="margin-top:18px; text-align:center; padding:24px 16px;">
            <div style="font-weight:700; font-size:14.5px;">Aún no tienes equipos registrados</div>
            <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4;">
              Agrega la marca, capacidad y fecha de instalación para llevar el control de su mantenimiento.
            </div>
            <button class="btn-primary" style="margin-top:16px;" onclick="go('agregarEquipo')">REGISTRAR MI PRIMER EQUIPO</button>
          </div>
        </div>
        ${bottomNav("home")}
      </div>`;
  }

  const conProximo = eqs.filter(e=>e.proximo);
  const proximo = conProximo.length
    ? [...conProximo].sort((a,b)=>diasRestantes(a.proximo)-diasRestantes(b.proximo))[0]
    : null;
  const dias = proximo ? diasRestantes(proximo.proximo) : null;

  return `
    <div class="screen">
      ${statusBar()}
      <div style="padding:8px 20px 0; display:flex; justify-content:flex-end;">
        <button class="iconbtn">${svg('bell',22,'#0B2A45')}</button>
      </div>
      <div class="scroll">
        <div style="font-size:22px; font-weight:800;">¡Hola!</div>
        <div style="font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4;">
          Tus aires, siempre en las mejores condiciones.
        </div>
        <div style="margin-top:22px; background:linear-gradient(135deg, var(--primary-deep), var(--primary)); border-radius:24px; height:140px; position:relative; display:flex; align-items:center; justify-content:center;">
          ${svg('wind',64,'rgba(255,255,255,0.9)',1.5)}
          <div style="position:absolute; top:16px; right:20px;">${svg('snowflake',22,'#BFE7F2')}</div>
          <div style="position:absolute; bottom:14px; left:24px;">${svg('snowflake',14,'#BFE7F2')}</div>
        </div>
        ${proximo ? `
        <div class="card" style="margin-top:18px;">
          <div style="font-size:11px; font-weight:700; color:var(--primary); letter-spacing:.4px; text-transform:uppercase;">Próximo mantenimiento</div>
          <div style="font-size:15px; font-weight:700; margin-top:6px;">${proximo.nombre} – ${proximo.marca}</div>
          <div style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13.5px;">
            ${svg('calendar',16,'#0E63B0')} ${fechaLarga(proximo.proximo)}
          </div>
          <div style="font-size:12.5px; color:var(--mint); font-weight:700; margin-top:2px;">
            ${dias>=0 ? `(faltan ${dias} día${dias===1?'':'s'})` : `(venció hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'})`}
          </div>
          <button class="btn-primary" style="margin-top:14px;" onclick="go('equipos')">VER MIS EQUIPOS</button>
        </div>` : `
        <div class="card" style="margin-top:18px;">
          <div style="font-size:13.5px; color:var(--ink-soft);">Ninguno de tus equipos tiene mantenimiento programado todavía.</div>
          <button class="btn-primary" style="margin-top:14px;" onclick="go('equipos')">VER MIS EQUIPOS</button>
        </div>`}
      </div>
      ${bottomNav("home")}
    </div>`;
}

function screenEquipos(){
  if(state.equipos.length === 0){
    return `
      <div class="screen">
        ${statusBar()}
        ${topBar("Mis Equipos","home", `<button class="iconbtn" onclick="go('agregarEquipo')">${svg('plus',22,'#0B2A45')}</button>`)}
        <div class="scroll" style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:60px;">
          <div style="width:64px;height:64px;border-radius:20px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;">
            ${svg('wind',30,'#0E63B0')}
          </div>
          <div style="font-weight:700; font-size:15px; margin-top:16px;">No tienes equipos registrados</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; max-width:240px; line-height:1.4;">
            Registra tu primer aire acondicionado para llevar el control de su mantenimiento.
          </div>
          <button class="btn-primary" style="margin-top:18px; max-width:220px;" onclick="go('agregarEquipo')">REGISTRAR EQUIPO</button>
        </div>
        ${bottomNav("equipos")}
      </div>`;
  }
  const rows = state.equipos.map(eq=>{
    return `<a class="equipo-row" href="javascript:void(0)" onclick="openEquipo(${eq.id})">
      <div class="card" style="display:flex; gap:12px; margin-bottom:12px;">
        <div class="equipo-icon">${svg('wind',22,'#0E63B0')}</div>
        <div style="flex:1;">
          <div style="font-weight:700; font-size:14.5px;">${eq.nombre}</div>
          <div style="font-size:12.5px; color:var(--ink-soft);">${eq.marca}</div>
          <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">Instalado: ${eq.instalado}</div>
          <div style="font-size:11.5px; color:var(--ink-soft);">Último mantenimiento: ${eq.ultimo || "Aún sin mantenimiento"}</div>
          <div class="chip" style="margin-top:8px;">${eq.proximo ? `Próximo: ${eq.proximo}` : "Sin mantenimiento programado"}</div>
        </div>
        <div style="align-self:center;">${svg('chevronRight',18,'#5B7A93')}</div>
      </div>
    </a>`;
  }).join("");
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Mis Equipos","home", `<button class="iconbtn" onclick="go('agregarEquipo')">${svg('plus',22,'#0B2A45')}</button>`)}
      <div class="scroll">${rows}</div>
      ${bottomNav("equipos")}
    </div>`;
}

function screenDetalle(){
  const eq = state.equipos.find(e=>e.id===state.equipoSelId) || state.equipos[0];
  const rows = [
    ["Marca / Modelo", eq.marca ? eq.marca.split(" ").slice(0,2).join(" ") : "Sin registrar"],
    ["Capacidad", eq.capacidad || "Sin registrar"],
    ["Fecha de instalación", eq.instalado || "Sin registrar"],
    ["Último mantenimiento", eq.ultimo || "Aún sin mantenimiento"],
    ["Próximo mantenimiento", eq.proximo || "Sin programar", true]
  ];
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Detalle del Equipo","equipos", svg('edit',19,'#0B2A45'))}
      <div class="scroll">
        <div style="display:flex; gap:14px; align-items:center;">
          <div style="width:56px;height:56px;border-radius:16px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;">
            ${svg('wind',28,'#0E63B0')}
          </div>
          <div>
            <div style="font-weight:800; font-size:17px;">${eq.nombre}</div>
            <div style="font-size:13px; color:var(--ink-soft);">${eq.marca}</div>
            <span style="display:inline-block;margin-top:4px;background:#E4F6EF;color:var(--mint);font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;">${eq.estado}</span>
          </div>
        </div>
        <div style="margin-top:20px; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;">Información</div>
        <div class="card" style="margin-top:8px; padding:4px;">
          ${rows.map(([label,val,hl],i)=>`
            <div style="display:flex; justify-content:space-between; padding:12px 14px; ${i<rows.length-1?'border-bottom:1px solid var(--line);':''}">
              <span style="font-size:13px; color:var(--ink-soft);">${label}</span>
              <span style="font-size:13px; font-weight:700; color:${hl?'var(--primary)':'var(--ink)'};">${val}</span>
            </div>`).join("")}
        </div>
        <div style="margin-top:20px; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;">Acciones</div>
        <button class="btn-primary" style="margin-top:10px;" onclick="go('agendar')">PROGRAMAR MANTENIMIENTO</button>
        <button class="btn-outline" style="margin-top:10px; margin-bottom:20px;" onclick="go('historial')">VER HISTORIAL</button>
      </div>
      ${bottomNav("equipos")}
    </div>`;
}

function screenAgregarEquipo(){
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Registrar Equipo", state.equipos.length ? "equipos" : "home")}
      <div class="scroll">
        <label class="field-label">Nombre / Ubicación</label>
        <input class="field-input" id="ne-nombre" type="text" placeholder="Ej: Sala, Dormitorio, Oficina" />

        <label class="field-label">Marca y modelo</label>
        <input class="field-input" id="ne-marca" type="text" placeholder="Ej: LG Inverter 12k BTU" />

        <label class="field-label">Capacidad</label>
        <input class="field-input" id="ne-capacidad" type="text" placeholder="Ej: 12,000 BTU" />

        <label class="field-label">Fecha de instalación</label>
        <input class="field-input" id="ne-instalado" type="date" />

        <button class="btn-primary" style="margin-top:20px; margin-bottom:20px;" onclick="registrarEquipo()">GUARDAR EQUIPO</button>
      </div>
      ${bottomNav("equipos")}
    </div>`;
}

function registrarEquipo(){
  const nombre = document.getElementById("ne-nombre").value.trim();
  const marca = document.getElementById("ne-marca").value.trim();
  const capacidad = document.getElementById("ne-capacidad").value.trim();
  const instaladoISO = document.getElementById("ne-instalado").value;

  if(!nombre){
    showToast("Ponle un nombre a tu equipo");
    return;
  }

  const nuevo = {
    id: nextId(),
    nombre,
    marca: marca || "Sin especificar",
    capacidad: capacidad || "Sin especificar",
    instalado: instaladoISO ? fechaISOaDMY(instaladoISO) : "-",
    ultimo: null,
    proximo: null,
    estado: "Activo",
    historial: []
  };
  state.equipos.push(nuevo);
  saveEquipos(state.equipos);
  state.equipoSelId = nuevo.id;
  showToast("Equipo registrado");
  go("detalle");
}

function screenAgendar(){
  if(state.equipos.length === 0){
    return `
      <div class="screen">
        ${statusBar()}
        ${topBar("Programar Mantenimiento","home")}
        <div class="scroll" style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:60px;">
          <div style="font-weight:700; font-size:14.5px;">Primero registra un equipo</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; max-width:240px;">
            Necesitas al menos un equipo para poder programarle un mantenimiento.
          </div>
          <button class="btn-primary" style="margin-top:16px; max-width:220px;" onclick="go('agregarEquipo')">REGISTRAR EQUIPO</button>
        </div>
        ${bottomNav("home")}
      </div>`;
  }
  const eq0 = state.equipoSelId ? state.equipos.find(e=>e.id===state.equipoSelId) : state.equipos[0];
  const opts = state.equipos.map(e=>`<option value="${e.id}" ${e.id===eq0.id?'selected':''}>${e.nombre} – ${e.marca}</option>`).join("");
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Programar Mantenimiento","equipos")}
      <div class="scroll">
        <label class="field-label">Equipo</label>
        <select class="field-input" id="f-equipo">${opts}</select>

        <label class="field-label">Fecha del mantenimiento</label>
        <input class="field-input" type="date" id="f-fecha" value="2025-07-15" />

        <label class="field-label">Tipo de mantenimiento</label>
        <select class="field-input" id="f-tipo">
          <option>Mantenimiento Preventivo</option>
          <option>Mantenimiento Correctivo</option>
          <option>Instalación</option>
          <option>Revisión de gas</option>
        </select>

        <label class="field-label">Técnico (opcional)</label>
        <select class="field-input" id="f-tecnico">
          <option>Elson S.</option>
          <option>Sin asignar</option>
        </select>

        <label class="field-label">Notas (opcional)</label>
        <textarea class="field-input" id="f-notas" style="min-height:70px; resize:none;" placeholder="Ej: limpieza de filtros, revisión de gas, etc."></textarea>

        <button class="btn-primary" style="margin-top:20px; margin-bottom:20px;" onclick="guardarMantenimiento()">GUARDAR</button>
      </div>
      ${bottomNav("equipos")}
    </div>`;
}

function guardarMantenimiento(){
  const equipoId = Number(document.getElementById("f-equipo").value);
  const fechaISO = document.getElementById("f-fecha").value;
  const tipo = document.getElementById("f-tipo").value;
  const tecnico = document.getElementById("f-tecnico").value;
  const notas = document.getElementById("f-notas").value;
  const fecha = fechaISO ? fechaISOaDMY(fechaISO) : "15/07/2025";

  const eq = state.equipos.find(e=>e.id===equipoId);
  if(eq){
    eq.proximo = fecha;
    eq.historial.unshift({fecha, tipo, tecnico: tecnico||"Sin asignar", notas: notas||"Sin notas."});
    saveEquipos(state.equipos);
  }
  state.lastSaved = {equipoId, fecha};
  showToast("Mantenimiento guardado");
  go("notificacion");
}

function screenNotificacion(){
  const nombre = state.lastSaved
    ? (state.equipos.find(e=>e.id===state.lastSaved.equipoId)?.nombre || "tu equipo")
    : "Sala";
  const fecha = state.lastSaved ? fechaLarga(state.lastSaved.fecha) : "15 de Julio de 2025";
  return `
    <div class="screen">
      <div style="flex:1; background:linear-gradient(180deg, #BFE0F2, #E7F2FA); display:flex; flex-direction:column; align-items:center; padding:60px 20px 0;">
        <div style="font-size:15px; font-weight:600;">Hoy</div>
        <div style="font-size:56px; font-weight:300; margin-top:4px;">${new Date().toTimeString().slice(0,5)}</div>
        <div style="margin-top:30px; width:100%; background:rgba(255,255,255,0.85); border-radius:18px; padding:16px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="width:22px;height:22px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;">
              ${svg('snowflake',13,'#fff')}
            </div>
            <span style="font-size:12.5px; font-weight:700;">AiresCare</span>
            <span style="font-size:11.5px; color:var(--ink-soft); margin-left:auto;">ahora</span>
          </div>
          <div style="font-weight:700; font-size:14px; margin-top:8px;">¡Recordatorio!</div>
          <div style="font-size:13px; margin-top:4px; line-height:1.5;">
            Tu aire acondicionado "${nombre}" tiene mantenimiento programado para el ${fecha}.
          </div>
          <div style="font-size:12px; color:var(--ink-soft); margin-top:8px;">Desliza para ver más</div>
        </div>
      </div>
      ${bottomNav("")}
    </div>`;
}

function screenHistorial(){
  const all = state.equipos.flatMap(eq=>eq.historial.map(h=>({...h, equipo:eq.nombre})))
    .sort((a,b)=>parseDMY(b.fecha)-parseDMY(a.fecha));
  const rows = all.map(h=>`
    <div class="card" style="display:flex; gap:10px; margin-bottom:10px;">
      ${svg('check',20,'#28A88B')}
      <div style="flex:1;">
        <div style="display:flex; justify-content:space-between;">
          <span style="font-weight:700; font-size:13.5px;">${h.fecha}</span>
          ${svg('chevronRight',16,'#5B7A93')}
        </div>
        <div style="font-size:12px; color:var(--primary); font-weight:700; margin-top:2px;">${h.equipo} · ${h.tipo}</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Técnico: ${h.tecnico}</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">Notas: ${h.notas}</div>
      </div>
    </div>`).join("");
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Historial de Mantenimientos","home", svg('filter',18,'#0B2A45'))}
      <div class="scroll">${rows || `
        <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:60px;">
          ${svg('clock',36,'#5B7A93')}
          <div style="font-weight:700; font-size:14.5px; margin-top:14px;">Sin registros todavía</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; max-width:240px;">
            Aquí verás el historial una vez que registres tu primer mantenimiento.
          </div>
        </div>`}</div>
      ${bottomNav("historial")}
    </div>`;
}

function screenConsejos(){
  const rows = CONSEJOS.map(c=>`
    <div class="card" style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
      <div class="equipo-icon">${svg(c.icon,20,'#0E63B0')}</div>
      <div style="font-size:13px; line-height:1.4;">${c.text}</div>
    </div>`).join("");
  return `
    <div class="screen">
      ${statusBar()}
      ${topBar("Consejos","home")}
      <div class="scroll">${rows}</div>
      ${bottomNav("")}
    </div>`;
}

/* ---------- Render principal ---------- */
function render(){
  const map = {
    home: screenHome,
    equipos: screenEquipos,
    detalle: screenDetalle,
    agregarEquipo: screenAgregarEquipo,
    agendar: screenAgendar,
    notificacion: screenNotificacion,
    historial: screenHistorial,
    consejos: screenConsejos
  };
  const fn = map[state.screen] || screenHome;
  document.getElementById("app").innerHTML = fn();
}
render();

/* ---------- Service worker + instalación ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").style.display = "flex";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  document.getElementById("installBanner").style.display = "none";
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
window.addEventListener("appinstalled", ()=>{
  document.getElementById("installBanner").style.display = "none";
});
</script>
</body>
</html>
