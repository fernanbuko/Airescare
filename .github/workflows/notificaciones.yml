name: Notificaciones de mantenimiento

on:
  schedule:
    # Corre cada 30 minutos (GitHub no garantiza el minuto exacto, puede
    # variar unos minutos según la carga de sus servidores).
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-latest
    # Corre en segundos normalmente; si algo se queda pegado (ej. un bache
    # de conexión con Firebase), que falle rápido y claro a los 5 minutos
    # en vez de quedarse colgado ~15 minutos antes de que GitHub lo cancele.
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Ejecutar script de notificaciones
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notifications.js
