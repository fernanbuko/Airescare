name: Notificaciones de mantenimiento

on:
  schedule:
    # 13:00 UTC = 8:00 AM en Ecuador (UTC-5)
    - cron: "0 13 * * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Ejecutar script de notificaciones
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notifications.js
